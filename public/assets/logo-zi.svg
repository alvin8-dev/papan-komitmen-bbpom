<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF953F"/>
      <stop offset="25%" stop-color="#FCF6BA"/>
      <stop offset="50%" stop-color="#B38728"/>
      <stop offset="75%" stop-color="#FBF5B7"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
  </defs>

  <!-- Central Shield with Safe Margin inside 340x340 -->
  <g transform="translate(10, 5)">
    <!-- Shadow baseline -->
    <path d="M 160,30 L 255,58 C 255,168 208,232 160,262 C 112,232 65,168 65,58 Z" fill="#0b2850" opacity="0.15" transform="translate(2, 4)"/>
    
    <!-- Central Shield -->
    <path d="M 160,30 L 255,58 C 255,168 208,232 160,262 C 112,232 65,168 65,58 Z" fill="url(#shieldGrad)" stroke="url(#goldRibbon)" stroke-width="5"/>
    <!-- Inner border line -->
    <path d="M 160,45 L 240,68 C 240,158 198,216 160,244 C 122,216 80,158 80,68 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>

    <!-- Core Content inside shield -->
    <path d="M 160,55 L 215,110 L 160,165 L 105,110 Z" fill="#FFFFFF" fill-opacity="0.1"/>
    
    <!-- Checkmark / Integrity Symbol -->
    <circle cx="160" cy="118" r="40" fill="#FFFFFF"/>
    <circle cx="160" cy="118" r="35" fill="#008844"/>
    <path d="M 144,118 L 155,129 L 178,103" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Text WBK & WBBM -->
    <text x="160" y="184" font-family="'Arial Black', 'Helvetica', sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      WBK - WBBM
    </text>
    <text x="160" y="202" font-family="'Arial', 'Helvetica', sans-serif" font-size="10" font-weight="bold" fill="#F7D070" text-anchor="middle" letter-spacing="1.5">
      MENUJU
    </text>

    <!-- Golden Banner / Ribbon -->
    <g>
      <path d="M 38,225 L 70,216 L 78,244 L 38,252 Z" fill="#996D1C"/>
      <path d="M 282,225 L 250,216 L 242,244 L 282,252 Z" fill="#996D1C"/>
      <path d="M 54,233 Q 160,258 266,233 L 260,270 Q 160,296 60,270 Z" fill="url(#goldRibbon)" stroke="#805500" stroke-width="1.5"/>
    </g>
    
    <text x="160" y="258" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#002147" text-anchor="middle" letter-spacing="1.5">
      ZONA INTEGRITAS
    </text>
  </g>
</svg>
