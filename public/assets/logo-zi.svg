<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF953F"/>
      <stop offset="25%" stop-color="#FCF6BA"/>
      <stop offset="50%" stop-color="#B38728"/>
      <stop offset="75%" stop-color="#FBF5B7"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Starburst / Seal -->
  <g filter="url(#shadow)">
    <!-- Central Shield -->
    <path d="M 160,25 L 260,55 C 260,170 210,235 160,265 C 110,235 60,170 60,55 Z" fill="url(#shieldGrad)" stroke="url(#goldRibbon)" stroke-width="6"/>
    <!-- Inner border line -->
    <path d="M 160,40 L 245,65 C 245,160 200,220 160,248 C 120,220 75,160 75,65 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>
  </g>

  <!-- Core Content inside shield -->
  <path d="M 160,50 L 220,110 L 160,170 L 100,110 Z" fill="#FFFFFF" fill-opacity="0.1"/>
  
  <!-- Checkmark / Integrity Symbol -->
  <circle cx="160" cy="115" r="42" fill="#FFFFFF"/>
  <circle cx="160" cy="115" r="37" fill="#008844"/>
  <path d="M 142,116 L 154,128 L 180,98" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text WBK & WBBM -->
  <text x="160" y="185" font-family="'Arial Black', 'Helvetica', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    WBK - WBBM
  </text>
  <text x="160" y="205" font-family="'Arial', 'Helvetica', sans-serif" font-size="10" font-weight="bold" fill="#F7D070" text-anchor="middle" letter-spacing="1.5">
    MENUJU
  </text>

  <!-- Golden Banner / Ribbon -->
  <g filter="url(#shadow)">
    <path d="M 30,225 L 65,215 L 75,245 L 30,255 Z" fill="#996D1C"/>
    <path d="M 290,225 L 255,215 L 245,245 L 290,255 Z" fill="#996D1C"/>
    <path d="M 50,235 Q 160,260 270,235 L 265,275 Q 160,300 55,275 Z" fill="url(#goldRibbon)" stroke="#805500" stroke-width="1.5"/>
  </g>
  
  <text x="160" y="260" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#002147" text-anchor="middle" letter-spacing="1.5">
    ZONA INTEGRITAS
  </text>
</svg>
