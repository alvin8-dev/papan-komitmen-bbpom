<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF953F"/>
      <stop offset="25%" stop-color="#FCF6BA"/>
      <stop offset="50%" stop-color="#B38728"/>
      <stop offset="75%" stop-color="#FBF5B7"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
  </defs>

  <!-- Central Shield with Generous Safe Margin inside 360x360 -->
  <g transform="translate(180, 175)">
    <!-- Shield Outline & Body -->
    <path d="M 0,-130 L 90,-104 C 90,-2 46,62 0,92 C -46,62 -90,-2 -90,-104 Z" fill="url(#shieldGrad)" stroke="url(#goldRibbon)" stroke-width="5"/>
    <path d="M 0,-115 L 75,-92 C 75,-10 38,46 0,72 C -38,46 -75,-10 -75,-92 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>

    <!-- Checkmark Circle -->
    <circle cx="0" cy="-40" r="38" fill="#FFFFFF"/>
    <circle cx="0" cy="-40" r="33" fill="#008844"/>
    <path d="M -15,-40 L -4,-29 L 18,-53" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Text WBK & WBBM -->
    <text x="0" y="24" font-family="'Arial Black', 'Helvetica', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      WBK - WBBM
    </text>
    <text x="0" y="40" font-family="'Arial', 'Helvetica', sans-serif" font-size="9.5" font-weight="bold" fill="#F7D070" text-anchor="middle" letter-spacing="1.2">
      MENUJU
    </text>

    <!-- Golden Banner / Ribbon -->
    <g>
      <path d="M -118,65 L -88,57 L -80,83 L -118,91 Z" fill="#996D1C"/>
      <path d="M 118,65 L 88,57 L 80,83 L 118,91 Z" fill="#996D1C"/>
      <path d="M -102,72 Q 0,96 102,72 L 96,108 Q 0,132 -96,108 Z" fill="url(#goldRibbon)" stroke="#805500" stroke-width="1.5"/>
    </g>
    
    <text x="0" y="96" font-family="'Arial Black', sans-serif" font-size="12.5" font-weight="900" fill="#002147" text-anchor="middle" letter-spacing="1.2">
      ZONA INTEGRITAS
    </text>
  </g>
</svg>
