<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldCorner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF6BA"/>
      <stop offset="40%" stop-color="#BF953F"/>
      <stop offset="70%" stop-color="#B38728"/>
      <stop offset="100%" stop-color="#8A6016"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#goldCorner)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Corner -->
    <path d="M 5,95 L 5,20 Q 5,5 20,5 L 95,5" stroke-width="4"/>
    <!-- Inner Corner Line -->
    <path d="M 14,90 L 14,24 Q 14,14 24,14 L 90,14" stroke-width="1.8"/>
    <!-- Thin Flourish Line -->
    <path d="M 22,85 L 22,28 Q 28,22 28,22 L 85,22" stroke-width="1" stroke-dasharray="2,3"/>
    
    <!-- Corner Filigree / Floral Motif -->
    <circle cx="28" cy="28" r="4" fill="url(#goldCorner)"/>
    <path d="M 28,28 Q 45,32 55,20 Q 42,42 28,28 Z" fill="url(#goldCorner)" opacity="0.85"/>
    <path d="M 28,28 Q 32,45 20,55 Q 42,42 28,28 Z" fill="url(#goldCorner)" opacity="0.85"/>
    <path d="M 28,28 L 60,60" stroke-width="2"/>
    <circle cx="60" cy="60" r="3" fill="url(#goldCorner)"/>
    <circle cx="10" cy="10" r="3.5" fill="url(#goldCorner)"/>
  </g>
</svg>

