<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b4079"/>
      <stop offset="100%" stop-color="#002147"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070"/>
      <stop offset="50%" stop-color="#C8963E"/>
      <stop offset="100%" stop-color="#996D1C"/>
    </linearGradient>
  </defs>
  
  <g transform="translate(180, 180)">
    <!-- Outer Blue Ring -->
    <circle cx="0" cy="0" r="142" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="5"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="3,3"/>
    
    <!-- Inner White Field -->
    <circle cx="0" cy="0" r="106" fill="#ffffff"/>
    
    <!-- Circular Text Path -->
    <path id="textCircleTop" d="M -112,0 A 112,112 0 0,1 112,0" fill="none"/>
    <text font-family="'Arial', 'Helvetica', sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="2.2">
      <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
        BADAN PENGAWAS OBAT DAN MAKANAN
      </textPath>
    </text>
    
    <path id="textCircleBottom" d="M 112,0 A 112,112 0 0,1 -112,0" fill="none"/>
    <text font-family="'Arial', 'Helvetica', sans-serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="3.2">
      <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
        REPUBLIK INDONESIA
      </textPath>
    </text>
    
    <!-- Center Graphic -->
    <path d="M 0,-90 C -20,-65 -40,-40 -35,-5 C -20,-30 0,-40 0,-90 Z" fill="#008844"/>
    <path d="M 0,-90 C 20,-65 40,-40 35,-5 C 20,-30 0,-40 0,-90 Z" fill="#00AA55"/>
    <path d="M 0,-70 L 0,5" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Cross/Shield Base -->
    <circle cx="0" cy="15" r="48" fill="#0b4079"/>
    <path d="M 0,-15 L 30,-5 C 30,30 0,52 0,52 C 0,52 -30,30 -30,-5 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Capsule -->
    <path d="M -15,10 C -15,2 -8,-4 0,-4 C 8,-4 15,2 15,10 L 15,22 L -15,22 Z" fill="#D9222A"/>
    <path d="M -15,22 L 15,22 L 15,34 C 15,42 8,48 0,48 C -8,48 -15,42 -15,34 Z" fill="#0b4079"/>
    <circle cx="0" cy="22" r="4" fill="#ffffff"/>

    <!-- Gold Star at Top -->
    <polygon points="0,-130 4,-120 14,-119 6,-112 8,-102 0,-108 -8,-102 -6,-112 -14,-119 -4,-120" fill="url(#goldGrad)"/>
  </g>
</svg>
