<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b4079"/>
      <stop offset="100%" stop-color="#002147"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070"/>
      <stop offset="50%" stop-color="#C8963E"/>
      <stop offset="100%" stop-color="#996D1C"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Blue Ring with Safe Margin -->
  <circle cx="160" cy="160" r="142" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="160" cy="160" r="130" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="3,3"/>
  
  <!-- Inner White Field -->
  <circle cx="160" cy="160" r="106" fill="#ffffff"/>
  
  <!-- Circular Text Path -->
  <path id="textCircleTop" d="M 48,160 A 112,112 0 0,1 272,160" fill="none"/>
  <text font-family="'Arial', 'Helvetica', sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="2.2">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      BADAN PENGAWAS OBAT DAN MAKANAN
    </textPath>
  </text>
  
  <path id="textCircleBottom" d="M 272,160 A 112,112 0 0,1 48,160" fill="none"/>
  <text font-family="'Arial', 'Helvetica', sans-serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="3.2">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      REPUBLIK INDONESIA
    </textPath>
  </text>
  
  <!-- Emblem Center Graphic: stylized mortar/pestle, capsule, and leaves -->
  <!-- Green Leaves -->
  <path d="M 160,70 C 140,95 120,120 125,155 C 140,130 160,120 160,70 Z" fill="#008844"/>
  <path d="M 160,70 C 180,95 200,120 195,155 C 180,130 160,120 160,70 Z" fill="#00AA55"/>
  <path d="M 160,90 L 160,165" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Medical/Pharma Cross and Shield Base -->
  <circle cx="160" cy="175" r="48" fill="#0b4079"/>
  <!-- Gold Shield Rim -->
  <path d="M 160,145 L 190,155 C 190,190 160,212 160,212 C 160,212 130,190 130,155 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="3"/>
  
  <!-- Stylized Capsule & Molecular Spark -->
  <path d="M 145,170 C 145,162 152,156 160,156 C 168,156 175,162 175,170 L 175,182 L 145,182 Z" fill="#D9222A"/>
  <path d="M 145,182 L 175,182 L 175,194 C 175,202 168,208 160,208 C 152,208 145,202 145,194 Z" fill="#0b4079"/>
  <circle cx="160" cy="182" r="4" fill="#ffffff"/>

  <!-- Gold Star at Top -->
  <polygon points="160,30 164,40 174,41 166,48 168,58 160,52 152,58 154,48 146,41 156,40" fill="url(#goldGrad)"/>
</svg>
